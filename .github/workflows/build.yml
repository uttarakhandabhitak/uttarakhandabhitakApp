name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

- name: Extract app project
  run: |
    mkdir -p build-project
   unzip -q UttarakhandAbhitakApp.zip -d build-project  
   unzip -q UttarakhandAbhitakApp.zip -d build-project
    find build-project -maxdepth 2 -type f | head -50
      
     - name: Find project directory
        run: |
          echo "Project files:"
          find build-project -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build AAB
        working-directory: build-project/UttarakhandAbhitakApp
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: UttarakhandAbhitak-release-AAB
          path: build-project/UttarakhandAbhitakApp/app/build/outputs/bundle/release/*.aab
